<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hush</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ===================== ЭКРАН: АВТОРИЗАЦИЯ ===================== -->
<div id="screen-auth" class="screen">
  <div class="auth-box">
    <!-- Место под иконку приложения: положите файл icon.png в /public -->
    <img id="app-icon" src="/icon.png" alt="Hush" onerror="this.style.display='none'">
    <h1>Hush</h1>

    <div id="auth-tabs">
      <button id="tab-login" class="tab active">Вход</button>
      <button id="tab-register" class="tab">Регистрация</button>
    </div>

    <!-- ВХОД -->
    <form id="form-login" class="auth-form">
      <input type="text" id="login-id" placeholder="Email или юзернейм" required>
      <input type="password" id="login-password" placeholder="Пароль" required>
      <button type="submit">Войти</button>
      <p class="error" id="login-error"></p>
    </form>

    <!-- РЕГИСТРАЦИЯ: шаг 1 -->
    <form id="form-reg-start" class="auth-form hidden">
      <input type="email" id="reg-email" placeholder="Email" required>
      <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required>
      <button type="submit">Получить код</button>
      <p class="error" id="reg-start-error"></p>
    </form>

    <!-- РЕГИСТРАЦИЯ: шаг 2, код -->
    <form id="form-reg-verify" class="auth-form hidden">
      <p class="hint">Код отправлен на почту</p>
      <input type="text" id="reg-code" placeholder="Код из письма" required>
      <button type="submit">Подтвердить</button>
      <p class="error" id="reg-verify-error"></p>
    </form>

    <!-- РЕГИСТРАЦИЯ: шаг 3, профиль -->
    <form id="form-reg-complete" class="auth-form hidden">
      <label id="avatar-picker">
        <img id="avatar-preview" src="" alt="">
        <span id="avatar-placeholder">Выбрать аватар</span>
        <input type="file" id="reg-avatar" accept="image/*" hidden>
      </label>
      <input type="text" id="reg-nickname" placeholder="Отображаемое имя" required>
      <input type="text" id="reg-username" placeholder="Юзернейм (мин. 4 символа)" required minlength="4">
      <button type="submit">Создать аккаунт</button>
      <p class="error" id="reg-complete-error"></p>
    </form>
  </div>
</div>

<!-- ===================== ЭКРАН: ПРИЛОЖЕНИЕ ===================== -->
<div id="screen-app" class="screen hidden">

  <div id="topbar">
    <div id="topbar-brand">
      <img id="app-icon-top" src="/icon.png" alt="Hush" onerror="this.style.display='none'; document.getElementById('app-title-fallback').classList.remove('hidden')">
      <span id="app-title-fallback" class="hidden">Hush</span>
    </div>

    <div id="main-tabs">
      <button class="main-tab active" data-page="feed">Лента</button>
      <button class="main-tab" data-page="friends">Друзья</button>
    </div>

    <input type="text" id="search-input" placeholder="Поиск людей...">

    <button id="settings-btn" title="Настройки">⚙</button>
    <div id="my-avatar" class="avatar"></div>
  </div>

  <div id="search-results" class="list hidden"></div>

  <div id="app-layout">

    <!-- Сайдбар: новости приложения от админов -->
    <div id="sidebar-news">
      <div id="news-header">Новости</div>

      <form id="announce-form" class="hidden">
        <textarea id="announce-text" placeholder="Новость для всех..." maxlength="1000"></textarea>
        <button type="submit">Опубликовать</button>
      </form>

      <div id="news-list"></div>
    </div>

    <!-- Основной контент -->
    <div id="main-content">

      <div id="feed-page" class="page">
        <form id="compose-form">
          <textarea id="compose-text" placeholder="Что нового?" maxlength="2000" required></textarea>
          <button type="submit">Запостить</button>
        </form>

        <div id="feed-sort">
          <button id="sort-new" class="sort-btn active" data-sort="new">Новое</button>
          <button id="sort-top" class="sort-btn" data-sort="top">Топ</button>
        </div>

        <div id="feed"></div>
      </div>

      <div id="friends-page" class="page hidden">
        <div id="friends-incoming-section">
          <h3 class="section-title hidden" id="incoming-title">Заявки в друзья</h3>
          <div id="friends-incoming" class="list"></div>
        </div>
        <div id="friends-outgoing-section">
          <h3 class="section-title hidden" id="outgoing-title">Исходящие заявки</h3>
          <div id="friends-outgoing" class="list"></div>
        </div>
        <div id="friends-list-section">
          <h3 class="section-title">Мои друзья</h3>
          <div id="friends-list" class="list"></div>
          <p id="friends-empty" class="hint hidden">Пока никого нет — найдите людей через поиск сверху.</p>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ===================== МОДАЛКА: ПРОФИЛЬ ===================== -->
<div id="modal-profile" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" onclick="closeProfile()">×</button>
    <div id="profile-avatar" class="avatar avatar-lg"></div>
    <h2 id="profile-nickname"></h2>
    <p id="profile-username"></p>
    <p id="profile-bio"></p>
    <button id="profile-friend-btn"></button>
    <div id="profile-posts"></div>
  </div>
</div>

<!-- ===================== МОДАЛКА: НАСТРОЙКИ ===================== -->
<div id="modal-settings" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" onclick="closeSettings()">×</button>
    <h2>Настройки</h2>

    <label id="settings-avatar-picker">
      <div id="settings-avatar" class="avatar avatar-lg"></div>
      <span>Сменить аватар</span>
      <input type="file" id="settings-avatar-input" accept="image/*" hidden>
    </label>

    <form id="settings-profile-form" class="auth-form">
      <input type="text" id="settings-nickname" placeholder="Отображаемое имя" required>
      <textarea id="settings-bio" placeholder="О себе" maxlength="200"></textarea>
      <button type="submit">Сохранить профиль</button>
      <p class="error" id="settings-profile-error"></p>
      <p class="success hidden" id="settings-profile-success">Сохранено</p>
    </form>

    <hr class="divider">

    <form id="settings-password-form" class="auth-form">
      <input type="password" id="settings-current-password" placeholder="Текущий пароль" required>
      <input type="password" id="settings-new-password" placeholder="Новый пароль (мин. 6 символов)" required>
      <button type="submit">Сменить пароль</button>
      <p class="error" id="settings-password-error"></p>
      <p class="success hidden" id="settings-password-success">Пароль изменён</p>
    </form>

    <hr class="divider">

    <div id="settings-theme-row">
      <span>Тёмная тема</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle">
        <span class="switch-track"></span>
      </label>
    </div>

    <hr class="divider">

    <button id="logout-btn" class="danger-btn">Выйти из аккаунта</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
</body>
</html>
